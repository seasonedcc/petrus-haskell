name: CI

# TEMPORARY baseline measurement on Blacksmith (ci-speed branch only).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GHC_VERSION: "9.10.3"
  CABAL_VERSION: "3.16.1.0"
  GHCUP_VERSION: "0.2.6.2"
  GHCUP_SHA256: 9ed5da5449b48043a0d17e767c05d2ef585e25a639bb934329496c6d2fad9cf8
  CABAL_DIR: /home/runner/.cabal

jobs:
  check:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 1s --health-timeout 5s --health-retries 60
    env:
      PETRUS_TEST_POSTGRES: postgresql://postgres:postgres@localhost:5432/postgres
      PETRUS_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Runner
        run: nproc; free -g; df -h / /tmp /dev/shm; env | grep -i -E 'image|blacksmith' | grep -v TOKEN || true; node --version; python3 --version; docker --version
      - uses: ./.github/actions/toolchain
        id: toolchain
      - name: Sync the upstream Python references
        run: scripts/upstream-python petrus && scripts/upstream-python petrus-engine
      - name: Restore dist-newstyle
        uses: actions/cache/restore@v4
        with:
          path: dist-newstyle
          key: dist-v1-${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-${{ github.sha }}
          restore-keys: dist-v1-${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-
      - name: Resolve dependencies
        run: cabal update && cabal build all --dry-run
      - name: Build
        run: time cabal build all -j
      - name: Sizes
        run: du -sh ~/.ghcup ~/.cabal/store ~/.cabal/packages dist-newstyle; du -sh dist-newstyle/build/*/*/* | sort -h | tail -5
      - name: Save the cabal store
        if: steps.toolchain.outputs.store-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
          key: ${{ steps.toolchain.outputs.store-key }}
      - name: Save dist-newstyle
        uses: actions/cache/save@v4
        with:
          path: dist-newstyle
          key: dist-v1-${{ runner.os }}-ghc-${{ env.GHC_VERSION }}-${{ github.sha }}
      - name: Tests (profiling run)
        run: |
          scripts/with-postgres cabal test all -j --keep-going --test-show-details=direct \
            --test-options='+RTS -M2G -RTS --print-slow-items=40'

  container:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Image build arguments
        id: source
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version=//p' deployment/python-shim)" >> "$GITHUB_OUTPUT"
          echo "created=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: deployment/Containerfile
      - name: Build the image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: deployment/Containerfile
          platforms: linux/amd64
          load: true
          tags: hamsterdan:ci
          build-args: |
            SOURCE_REVISION=${{ steps.source.outputs.revision }}
            SOURCE_VERSION=${{ steps.source.outputs.version }}
            SOURCE_CREATED=${{ steps.source.outputs.created }}
      - name: Check the runtime contract
        run: |
          scripts/container-smoke hamsterdan:ci \
            --revision "${{ steps.source.outputs.revision }}" --version "${{ steps.source.outputs.version }}"
