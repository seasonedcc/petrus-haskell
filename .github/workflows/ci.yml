name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PETRUS_TEST_POSTGRES: postgresql://postgres:postgres@localhost:5432/postgres
      # petrus-execution: also run the shared Docker provider tests against the runner's daemon.
      PETRUS_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.16.1.0"
      - uses: astral-sh/setup-uv@v6
      # The upstream Python references (upstream/petrus for most interop
      # suites, upstream/petrus-engine for petrus-engine-file's live
      # differential and format-CLI specs), on the exact CPython that
      # scripts/upstream-python pins. scripts/check-all provisions them too;
      # doing it here first surfaces a provisioning failure as its own step.
      - name: Sync the upstream Python references
        run: scripts/upstream-python petrus && scripts/upstream-python petrus-engine
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev libpq-dev libsqlite3-dev graphviz
      - name: Resolve dependencies
        run: cabal update && cabal build all --dry-run
      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project', 'dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-
      - name: Check everything
        run: scripts/check-all

  # The Haskell port's container runtime contract (PARITY.md, "Container
  # runtime contract"): lint the launcher, the interpreter-path shim, the
  # smoke scripts and the Containerfile; build deployment/Containerfile for
  # linux/amd64 with the reference's build arguments, reusing layers from
  # the GitHub Actions cache; then run scripts/container-smoke against the
  # built image. It checks at run time what the reference's release
  # verification, Ansible playbooks and systemd unit expect of the image.
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Lint the launcher, the interpreter-path shim and the smoke scripts
        run: |
          shellcheck scripts/with-runtime-secrets scripts/container-smoke scripts/container-smoke.d/fake-op
          shellcheck --shell=sh deployment/python-shim
      - name: Lint the Containerfile
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod 0755 "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" --failure-threshold error deployment/Containerfile
      - name: Image build arguments
        id: source
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version=//p' deployment/python-shim)" >> "$GITHUB_OUTPUT"
          echo "created=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Containerfile
          platforms: linux/amd64
          load: true
          tags: hamsterdan:ci
          build-args: |
            SOURCE_REVISION=${{ steps.source.outputs.revision }}
            SOURCE_VERSION=${{ steps.source.outputs.version }}
            SOURCE_CREATED=${{ steps.source.outputs.created }}
          cache-from: type=gha,scope=hamsterdan-image
          cache-to: type=gha,scope=hamsterdan-image,mode=max
      - name: Check the runtime contract
        run: |
          scripts/container-smoke hamsterdan:ci \
            --revision "${{ steps.source.outputs.revision }}" --version "${{ steps.source.outputs.version }}"
