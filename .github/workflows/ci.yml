name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PETRUS_TEST_POSTGRES: postgresql://postgres:postgres@localhost:5432/postgres
      # petrus-execution: also run the shared Docker provider tests against the runner's daemon.
      PETRUS_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.16.1.0"
      - uses: astral-sh/setup-uv@v6
      # The upstream Python references (upstream/petrus for most interop
      # suites, upstream/petrus-engine for petrus-engine-file's live
      # differential and format-CLI specs), on the exact CPython that
      # scripts/upstream-python pins. scripts/check-all provisions them too;
      # doing it here first surfaces a provisioning failure as its own step.
      - name: Sync the upstream Python references
        run: scripts/upstream-python petrus && scripts/upstream-python petrus-engine
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev libpq-dev libsqlite3-dev graphviz
      - name: Resolve dependencies
        run: cabal update && cabal build all --dry-run
      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project', 'dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-
      - name: Check everything
        run: scripts/check-all
