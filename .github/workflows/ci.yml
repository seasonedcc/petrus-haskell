name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PETRUS_TEST_POSTGRES: postgresql://postgres:postgres@localhost:5432/postgres
      # petrus-execution: also run the shared Docker provider tests against the runner's daemon.
      PETRUS_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.16.1.0"
      - uses: astral-sh/setup-uv@v6
      # petrus-engine-file: the live differential and format-CLI specs run
      # against the pinned petrus-engine on CPython 3.14 (pending without it).
      - name: Sync the petrus-engine reference
        run: uv sync --frozen --python 3.14 --project upstream/petrus-engine
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libzmq3-dev libpq-dev libsqlite3-dev graphviz
      - name: Resolve dependencies
        run: cabal update && cabal build all --dry-run
      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project', 'dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-${{ runner.os }}-
      - name: Check everything
        run: scripts/check-all
